# Port-80 vhost for the GamePlan Next.js app (reverse-proxied to the systemd
# service on 127.0.0.1:3473). certbot --apache will generate the matching
# -le-ssl.conf with the HTTP->HTTPS redirect.
#
# Replace GAMEPLAN_HOST with the chosen subdomain (e.g. gameplan2.stephens.page)
# before enabling. Filename should match: GAMEPLAN_HOST.conf
<VirtualHost *:80>
    ServerName GAMEPLAN_HOST
    ServerAdmin jacob.stephens.701@gmail.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3473/
    ProxyPassReverse / http://127.0.0.1:3473/

    ErrorLog ${APACHE_LOG_DIR}/gameplan-error.log
    CustomLog ${APACHE_LOG_DIR}/gameplan-access.log combined
</VirtualHost>
